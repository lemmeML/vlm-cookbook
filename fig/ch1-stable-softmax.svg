  </circle>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/><set attributeName="opacity" to="0" begin="3.4s" fill="freeze"/><text x="626.9230769230769" y="128" class="small" text-anchor="middle" style="fill:#C96442">2.7e43</text><text x="618.3076923076924" y="114" class="small" text-anchor="middle" style="fill:#C96442">3.6e42</text><text x="605.3846153846154" y="128" class="small" text-anchor="middle" style="fill:#C96442">1.8e41</text><text x="583.8461538461538" y="114" class="small" text-anchor="middle" style="fill:#C96442">1.2e39</text><text x="562.3076923076924" y="128" class="small" text-anchor="middle" style="fill:#C96442">8.2e36</text>
    <text x="80" y="202" class="label" style="fill:#C96442">e<tspan font-size="9" dy="-5">z</tspan><tspan dy="5"> is far past 65,504, the largest float16, every entry becomes inf</tspan></text>
    <text x="80" y="220" class="small">inf / inf is nan, and training breaks</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.4s" fill="freeze"/>
    <text x="80" y="202" class="label">subtract c = max(z) = 100, the largest score lands on 0</text>
