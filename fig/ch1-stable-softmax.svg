  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
    <text x="80" y="30" class="title">Softmax without overflow</text>
    <text x="80" y="50" class="formula">e<tspan font-size="9" dy="-5">z</tspan><tspan dy="5"> / Σ e</tspan><tspan font-size="9" dy="-5">z</tspan><tspan dy="5">  =  e</tspan><tspan font-size="9" dy="-5">z − c</tspan><tspan dy="5"> / Σ e</tspan><tspan font-size="9" dy="-5">z − c</tspan></text>
  </g>
