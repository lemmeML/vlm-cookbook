    <line x1="110.0" y1="150" x2="670.0" y2="150" class="axis"/>
    <line x1="110.0" y1="146" x2="110.0" y2="154" class="axis"/><text x="110.0" y="168" class="small" text-anchor="middle">−20</text><line x1="196.15384615384616" y1="146" x2="196.15384615384616" y2="154" class="axis"/><text x="196.15384615384616" y="168" class="small" text-anchor="middle">0</text><line x1="282.3076923076923" y1="146" x2="282.3076923076923" y2="154" class="axis"/><text x="282.3076923076923" y="168" class="small" text-anchor="middle">20</text><line x1="368.46153846153845" y1="146" x2="368.46153846153845" y2="154" class="axis"/><text x="368.46153846153845" y="168" class="small" text-anchor="middle">40</text><line x1="454.61538461538464" y1="146" x2="454.61538461538464" y2="154" class="axis"/><text x="454.61538461538464" y="168" class="small" text-anchor="middle">60</text><line x1="540.7692307692307" y1="146" x2="540.7692307692307" y2="154" class="axis"/><text x="540.7692307692307" y="168" class="small" text-anchor="middle">80</text><line x1="626.9230769230769" y1="146" x2="626.9230769230769" y2="154" class="axis"/><text x="626.9230769230769" y="168" class="small" text-anchor="middle">100</text>
