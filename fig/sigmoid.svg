    </animateMotion>
  </circle>

  <!-- quiet typographic header -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
    <text x="80" y="30" class="title">Sigmoid</text>
    <text x="80" y="50" class="formula">σ(x) = 1 / (1 + e<tspan dy="-5" font-size="9.5">−x</tspan><tspan dy="5">)</tspan></text>
