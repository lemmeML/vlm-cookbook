    <text x="80.0" y="364" class="tick" text-anchor="middle">−8</text><text x="680.0" y="364" class="tick" text-anchor="middle">8</text><text x="68" y="348.0" class="tick" text-anchor="end">0</text><text x="68" y="64.0" class="tick" text-anchor="end">1</text>
