<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <!-- transparent background -->
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8A8378; }
    .title { font-size: 15px; fill: #2E2A25; font-weight: 500; letter-spacing: 0.06em; }
