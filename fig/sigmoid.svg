  <!-- small dot glides along, settles at x=8 -->
  <circle r="3.5" class="dot" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze"/>
    <animateMotion dur="2.4s" begin="0.4s" fill="freeze" calcMode="linear">
