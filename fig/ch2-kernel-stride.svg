  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="6.8999999999999995s" fill="freeze"/><rect x="380" y="275" width="120" height="15" class="accent" opacity="0.22"/><text x="440.0" y="263" class="small" text-anchor="middle">6</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="7.3999999999999995s" fill="freeze"/><rect x="440" y="275" width="120" height="15" class="accent" opacity="0.22"/><text x="500.0" y="267" class="small" text-anchor="middle">7</text></g>
