<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- transparent background -->
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8A8378; }
    .title { font-size: 15px; fill: #C96442; font-weight: 500; letter-spacing: 0.06em; }
    .formula { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 13px; fill: #8A8378; }
    .tick { font-size: 11px; }
    .small { font-size: 9.5px; }
    .label { font-size: 12px; fill: #8A8378; }
    .axis { stroke: #C9C2B6; stroke-width: 1; }
    .bound { stroke: #DDD6C9; stroke-width: 1; stroke-dasharray: 3 5; }
    .cell { fill: #F1ECE3; stroke: #DDD6C9; stroke-width: 1; }
    .win { fill: none; stroke: #C96442; stroke-width: 2; }
